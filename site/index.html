<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumeo — Forensic Engagement Analysis</title>
<style>
  :root { --bg:#0b0f14; --panel:#141a23; --text:#dde4ec; --muted:#7c8a9a; --line:#222a36; --accent:#60a5fa; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:radial-gradient(ellipse at top, #1a2230 0%, #0b0f14 60%); color:var(--text); font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:36px 40px; max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h1 { margin:0 0 6px; font-size:24px; }
  .sub { color:var(--muted); margin-bottom:24px; font-size:13px; }
  label { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin:14px 0 4px; }
  input { width:100%; background:#0b0f14; border:1px solid var(--line); color:var(--text); padding:9px 12px; font:14px system-ui,sans-serif; border-radius:6px; box-sizing:border-box; }
  input:focus { outline:none; border-color:var(--accent); }
  .show-pw { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:var(--muted); cursor:pointer; text-transform:none; letter-spacing:0; }
  .show-pw input { width:auto; cursor:pointer; }
  button { margin-top:18px; width:100%; background:var(--accent); color:#0b0f14; font-weight:600; border:none; padding:10px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:hover { background:#4a8fd9; }
  .err { color:#f87171; font-size:13px; margin-top:10px; min-height:18px; }
  .meta { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; line-height:1.5; }
  .meta a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <h1>💡 Lumeo — Forensic Engagement Analysis</h1>
  <div class="sub">Forensic engagement analysis — please sign in</div>
  <form id="login" onsubmit="doLogin(event); return false;">
    <label>Username</label>
    <input type="text" id="u" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <label>Password</label>
    <input type="password" id="p" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="show-pw"><input type="checkbox" id="showpw" onchange="document.getElementById('p').type=this.checked?'text':'password'"> Mostrar senha</label>
    <button type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
  <div class="meta">
    Public, read-only forensic analysis · <a href="/privacy.html">Privacy Policy</a>
  </div>
</div>
<script>
const TENANTS = [{"id": "admin", "name": "Admin", "user_hash": "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918", "pw_hash": "0eb8892edfe7d238c9d664b226d69c64e9dcfd5f9d665c4d62693a731f588994"}, {"id": "cross", "name": "Cross Wave", "user_hash": "27b82e16ab5d8e231f7957ffcddd317cbdfeb656df059c4f1c332a8f3242ecf2", "pw_hash": "ff311bc208f4b215b88aea2c5df61d2ee7fae0d4e5dbdc49ed310d7c1ce176b9"}, {"id": "demo", "name": "Demo \u00b7 Lumeo", "user_hash": "2a97516c354b68848cdbd8f54a226a0a55b21ed138e207ad6c5cbb9c00aa5aea", "pw_hash": "f9af6f3b04093fce1851b3aa03b88f6ba483d6cffdbfd742458c1d9209e02961"}];
async function sha256(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
async function doLogin(e) {
  if (e && e.preventDefault) e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const u = document.getElementById("u").value.trim().toLowerCase();
  const p = document.getElementById("p").value.trim();
  if (!u || !p) { err.textContent = "Preencha usuário e senha."; return; }
  const uh = await sha256(u);
  const ph = await sha256(p);
  const match = TENANTS.find(t => t.user_hash === uh && t.pw_hash === ph);
  if (!match) { err.textContent = "Usuário ou senha incorretos."; return; }
  // Pré-marca a sessão do tenant correto pra o dashboard destrancar automaticamente
  sessionStorage.setItem("cwm_authed_" + match.id, "1");
  window.location = "./" + match.id + "/";
}
</script>
</body>
</html>
